[package]
name = "glassrip-media"
version = "0.1.0"
edition = "2021"
description = "Frame features, ECC alignment, ink metric and keyframe segmentation for glassrip meeting mode"
publish = false

[dependencies]
rayon = "1"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
zune-core = "0.5"
zune-jpeg = "0.5"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
