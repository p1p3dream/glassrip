[package]
name = "glassrip-vision-stages"
version = "0.1.0"
edition = "2021"
description = "Vision-branch stages of glassrip meeting mode: OCR harvest, classify, canvas crop, board read, board validate"
publish = false

[features]
default = []
# PP-OCRv5 on ONNX Runtime (CPU unless `cuda`).
onnx = ["glassrip-ocr/onnx"]
# PP-OCRv5 on the CUDA execution provider, ONNX Runtime loaded from ORT_DYLIB_PATH.
cuda = ["onnx", "glassrip-ocr/cuda"]

[dependencies]
async-trait = "0.1"
blake3 = "1"
fs-err = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
glassrip-core = { path = "../glassrip-core" }
glassrip-ocr = { path = "../glassrip-ocr" }
glassrip-vision = { path = "../glassrip-vision" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
schemars = { version = "1.2", features = ["semver1"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
strsim = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
glassrip-meeting = { path = "../glassrip-meeting" }
wiremock = "0.6"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
