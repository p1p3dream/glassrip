[package]
name = "glassrip-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Core types, versioned artifact envelopes, cache, manifest, config, and stage runner for glassrip"
publish = false

[dependencies]
blake3 = "1.8.7"
fs-err = "3.3.1"
fs4 = { version = "1.1.0", default-features = false, features = ["fs-err3"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
garde = { version = "0.23.0", features = ["derive", "url"] }
schemars = { version = "1.2.2", features = ["semver1"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "time", "macros", "sync"] }
tokio-util = "0.7.19"
toml = "1.1.6"
tracing = "0.1.44"

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
