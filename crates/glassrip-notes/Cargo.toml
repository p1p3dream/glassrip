[package]
name = "glassrip-notes"
version = "0.1.0"
edition = "2021"
description = "Speaker naming and citation-validated meeting notes for glassrip meeting mode"
license = "MIT"
publish = false

[features]
default = []
# PP-OCRv5 tile-name reading through ONNX Runtime, loaded at run time from
# ORT_DYLIB_PATH (load-dynamic), the same setup glassrip-audio documents.
ocr = ["dep:ort", "dep:ndarray"]
# Register the CUDA execution provider for OCR (fails loudly when unavailable).
ocr-cuda = ["ocr", "ort/cuda"]

[dependencies]
async-trait = "0.1"
backon = "1.6"
glassrip-audio = { path = "../glassrip-audio" }
glassrip-core = { path = "../glassrip-core" }
glassrip-meeting = { path = "../glassrip-meeting" }
glassrip-vision = { path = "../glassrip-vision" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ndarray = { version = "0.17", optional = true }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "load-dynamic", "api-27"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
schemars = "1.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "macros", "rt"] }
tracing = "0.1"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tokio-util = "0.7"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
