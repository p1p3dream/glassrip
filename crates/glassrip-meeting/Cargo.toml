[package]
name = "glassrip-meeting"
version = "0.1.0"
edition = "2021"
description = "Board-state consolidation for glassrip meeting mode: edge direction, registration, voting, owners and computed change events"
publish = false

[dependencies]
glassrip-core = { path = "../glassrip-core" }
glassrip-media = { path = "../glassrip-media" }
glassrip-vision = { path = "../glassrip-vision" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
nalgebra = "0.32"
schemars = "1.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt"] }
tokio-util = "0.7"

[dev-dependencies]
async-trait = "0.1"
imageproc = "0.25"
proptest = "1.11"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
