[package]
name = "glassrip-eval"
version = "0.1.0"
edition = "2021"
description = "Golden fixtures, metrics, recorded-response replay, and the regression gate for glassrip"
publish = false

[dependencies]
glassrip-core = { path = "../glassrip-core" }
glassrip-vision = { path = "../glassrip-vision" }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
font8x8 = "0.3"
fs-err = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strsim = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tokio-util = "0.7"
toml = "1"
unicode-normalization = "0.1"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[[bin]]
name = "glassrip-privacy-scan"
path = "src/bin/privacy_scan.rs"
