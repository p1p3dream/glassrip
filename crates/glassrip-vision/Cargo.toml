[package]
name = "glassrip-vision"
version = "0.1.0"
edition = "2021"
description = "Vision model backends, schema-constrained requests, and validation for glassrip meeting mode"
publish = false

[dependencies]
async-trait = "0.1"
backon = "1.6"
base64 = "0.22"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jsonschema = { version = "0.57", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
